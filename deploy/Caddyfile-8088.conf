# ============================================================
#  8.130.177.176:8088 站点配置（Caddyfile 片段）
#  目标地址：https://8.130.177.176:8088/ocr
#  前端包：deploy/ocr-8088.zip 解压到 /var/www/ocr/
#          （目录内为 index.html、assets/、favicon.svg）
# ============================================================

:8088 {
    encode gzip

    # ---------- 1. 前端静态站点：/ocr/ 子路径 ----------
    handle /ocr/* {
        root * /var/www
        try_files {path} /ocr/index.html
        file_server
    }
    # 访问 /ocr 自动补斜杠
    redir /ocr /ocr/ 308

    # ---------- 2. OCR 接口同源代理（方案 A，推荐） ----------
    # 加上这段后，把前端 .env.production 的 VITE_OCR_ENDPOINT 改回 /api/ocr 重新构建
    # 页面是用 https 打开的，浏览器不允许它直接请求 http://8.130.177.176:48984
    # （混合内容拦截 + 后端无 CORS）。必须由 8088 同源转发。
    handle /api/* {
        reverse_proxy 127.0.0.1:48984
    }
}
